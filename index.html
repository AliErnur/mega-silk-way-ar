<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MEGA Silk Way • Golden Ornament AR</title>
  <style>
    :root {
      --bg: #050a17;
      --velvet: #0b152b;
      --velvet-2: #122140;
      --text: #fbf7ee;
      --muted: #d6cebe;
      --gold: #eab34e;
      --gold-light: #fde68a;
      --gold-dark: #8a5a14;
      --turquoise: #2dd4bf;
      --ok: #34d399;
      --tap: 48px;
      --r-xl: 24px;
      --r-lg: 18px;
      --r-md: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      min-height: 100dvh;
      background: radial-gradient(circle at 50% 0%, #1a2e5a 0%, var(--bg) 74%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .device-shell {
      width: 100%;
      max-width: 440px;
      min-height: 100dvh;
      background: var(--velvet);
      border-inline: 1px solid rgba(234, 179, 78, 0.35);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    @media (min-width: 520px) {
      body { padding: 18px; align-items: center; }
      .device-shell {
        min-height: 780px;
        max-height: 920px;
        border: 1.5px solid rgba(234, 179, 78, 0.45);
        border-radius: 30px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.68);
      }
    }

    /* Живая камера */
    #arCamera {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      z-index: 0;
    }

    #arCamera.active { display: block; }

    /* Тонкий золотой орнаментальный узор по краям экрана */
    .ornament-frame {
      position: absolute;
      inset: 8px;
      z-index: 1;
      pointer-events: none;
      border-radius: 22px;
      border: 1px solid rgba(234, 179, 78, 0.42);
      background-image:
        repeating-linear-gradient(90deg, rgba(234, 179, 78, 0.22) 0 2px, transparent 2px 14px),
        repeating-linear-gradient(90deg, rgba(234, 179, 78, 0.22) 0 2px, transparent 2px 14px);
      background-size: 100% 3px, 100% 3px;
      background-position: top, bottom;
      background-repeat: no-repeat;
    }

    .device-shell.cam-live { background: transparent; }

    .topbar, .viewport, .dock { position: relative; z-index: 2; }

    /* Компактная шапка с золотым орнаментом */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px;
      background: linear-gradient(180deg, rgba(6, 12, 26, 0.88), rgba(6, 12, 26, 0.62));
      border-bottom: 1px solid rgba(234, 179, 78, 0.35);
    }

    .brand-mark {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .brand-kicker {
      font-size: 10px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--gold-light);
      font-weight: 700;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text);
    }

    .top-controls { display: flex; gap: 6px; }

    /* Изящные кнопки без громоздких блоков */
    button {
      font-family: inherit;
      color: var(--text);
      background: rgba(11, 21, 43, 0.72);
      border: 1px solid rgba(234, 179, 78, 0.45);
      border-radius: var(--r-md);
      min-height: var(--tap);
      padding: 8px 12px;
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1.15;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease;
    }

    button:active { transform: scale(0.97); }
    button:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 2px; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-ornament-gold {
      background: linear-gradient(135deg, rgba(161, 98, 7, 0.92), rgba(234, 179, 78, 0.95));
      border: 1px solid var(--gold-light);
      color: #070c18;
      font-weight: 800;
      box-shadow: 0 6px 20px rgba(234, 179, 78, 0.28);
    }

    .btn-ornament-glass {
      background: rgba(10, 20, 42, 0.64);
      border: 1px solid rgba(253, 230, 138, 0.55);
      color: var(--gold-light);
      box-shadow: inset 0 0 0 1px rgba(234, 179, 78, 0.18);
    }

    .viewport {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .scene-screen { display: none; flex-direction: column; justify-content: space-between; gap: 12px; flex: 1; }
    .scene-screen.active { display: flex; }

    /* Орнаментальная карточка */
    .ornate-card {
      background: rgba(9, 17, 36, 0.62);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(234, 179, 78, 0.42);
      border-radius: var(--r-lg);
      padding: 13px;
      box-shadow: inset 0 0 0 1px rgba(253, 230, 138, 0.12);
    }

    .hero-title {
      font-size: 20px;
      line-height: 1.22;
      color: var(--gold-light);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.75);
    }

    .sub-copy {
      font-size: 12.5px;
      line-height: 1.42;
      color: var(--muted);
    }

    /* Медальон батыра, золотой арки, каравана и шкатулки */
    .hero-medallion {
      position: relative;
      border-radius: var(--r-xl);
      border: 1.5px solid rgba(234, 179, 78, 0.62);
      background: radial-gradient(circle at 50% 25%, rgba(234, 179, 78, 0.25), rgba(7, 13, 28, 0.78) 76%);
      padding: 14px;
      overflow: hidden;
      min-height: 166px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    #introVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      z-index: 0;
    }

    #introVideo.has-video { display: block; }

    .medallion-center {
      position: relative;
      z-index: 1;
      text-align: center;
      margin: auto 0;
    }

    .arch-motif {
      width: 112px;
      height: 62px;
      margin: 0 auto 6px;
      border-top: 3px solid var(--gold-light);
      border-left: 3px solid var(--gold);
      border-right: 3px solid var(--gold);
      border-radius: 60px 60px 8px 8px;
      box-shadow: 0 0 22px rgba(234, 179, 78, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 20px;
      background: rgba(11, 21, 43, 0.45);
    }

    /* Пространство AR-охоты: максимум открытого вида на камеру */
    .ar-arena {
      position: relative;
      flex: 1;
      min-height: 350px;
      border-radius: var(--r-xl);
      border: 1px solid rgba(234, 179, 78, 0.55);
      overflow: hidden;
    }

    #arSparks {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .ar-layer {
      position: relative;
      z-index: 2;
      height: 100%;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .ar-pill-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .gold-chip {
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      background: rgba(9, 17, 36, 0.72);
      border: 1px solid rgba(234, 179, 78, 0.55);
      color: var(--gold-light);
      backdrop-filter: blur(6px);
    }

    .catch-zone {
      position: relative;
      flex: 1;
      width: 100%;
    }

    /* Орнаментальный AR-артефакт для захвата */
    .ar-chest-btn {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #fde68a, #eab34e 62%, #78350f);
      border: 2.5px solid var(--gold-light);
      box-shadow: 0 0 0 5px rgba(234, 179, 78, 0.22), 0 0 28px rgba(234, 179, 78, 0.65);
      color: #070c18;
      font-weight: 900;
      font-size: 10.5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: left 0.45s ease, top 0.45s ease, transform 0.15s ease;
    }

    .ar-chest-btn:active { transform: translate(-50%, -50%) scale(0.92); }

    .compact-caption {
      background: rgba(8, 15, 31, 0.72);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(234, 179, 78, 0.4);
      border-radius: var(--r-md);
      padding: 9px 11px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .compact-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* Маршрут и подарки */
    .route-ribbon {
      display: flex;
      gap: 6px;
    }

    .route-stop-pill {
      flex: 1;
      text-align: center;
      padding: 7px 6px;
      border-radius: var(--r-md);
      font-size: 11px;
      font-weight: 800;
      background: rgba(9, 17, 36, 0.72);
      border: 1px solid rgba(234, 179, 78, 0.35);
      color: var(--muted);
    }

    .route-stop-pill.done {
      border-color: var(--ok);
      color: var(--ok);
    }

    .list-stack { display: flex; flex-direction: column; gap: 8px; }

    .ornate-row {
      background: rgba(9, 17, 36, 0.68);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(234, 179, 78, 0.38);
      border-radius: var(--r-md);
      padding: 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .ornate-row.done { border-color: rgba(52, 211, 153, 0.7); }

    .row-flex {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .tiny-legal {
      font-size: 10.5px;
      line-height: 1.35;
      color: var(--gold-light);
      opacity: 0.88;
    }

    /* Нижняя орнаментальная панель */
    .dock {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      padding: 8px 10px;
      background: rgba(6, 12, 26, 0.9);
      border-top: 1px solid rgba(234, 179, 78, 0.4);
      backdrop-filter: blur(10px);
    }

    .dock button {
      min-height: var(--tap);
      padding: 6px 4px;
      font-size: 11.5px;
      border-radius: 11px;
      background: rgba(15, 27, 54, 0.75);
    }

    .dock button.active {
      border-color: var(--gold-light);
      color: var(--gold-light);
      background: linear-gradient(180deg, rgba(234, 179, 78, 0.25), rgba(146, 64, 14, 0.25));
    }
  </style>
</head>
<body>
  <div class="device-shell" id="deviceShell">
    <video id="arCamera" autoplay playsinline muted></video>
    <div class="ornament-frame"></div>

    <header class="topbar">
      <div class="brand-mark">
        <span class="brand-kicker" id="txtKicker">АЛТЫН КЕРУЕН • AR</span>
        <span class="brand-name">MEGA SILK WAY</span>
      </div>
      <div class="top-controls">
        <button type="button" id="btnLang" onclick="toggleLang()">KZ</button>
        <button type="button" id="btnSound" onclick="toggleSound()">🔇</button>
        <button type="button" class="btn-ornament-glass" id="btnCamTop" onclick="toggleCamera()">📷 AR</button>
      </div>
    </header>

    <main class="viewport">
      <!-- 1. QR / 30с -->
      <section class="scene-screen active" id="screen-qr">
        <div class="row-flex" style="flex-wrap: wrap;">
          <span class="gold-chip" id="txtBadgeQr">✦ QR • БЕЗ РЕГИСТРАЦИИ</span>
          <span class="gold-chip" id="txtBadgeTime">0 / 30 с</span>
        </div>

        <h1 class="hero-title" id="txtTitle">Дар Батыра и Зимний Караван</h1>

        <div class="hero-medallion">
          <video id="introVideo" playsinline controls></video>
          <div class="medallion-center" id="medallionCenter">
            <div class="arch-motif">⚔️🐪✨</div>
            <strong style="font-size: 12.5px; color: var(--gold-light);" id="txtSceneBeat"></strong>
          </div>
          <div class="row-flex" style="position: relative; z-index: 1;">
            <span style="font-size: 11px; color: var(--muted);" id="txtVideoHint"></span>
            <span class="gold-chip" style="padding: 3px 8px; font-size: 10px;">EXPO</span>
          </div>
        </div>

        <p class="sub-copy" id="txtIntroCopy"></p>

        <div class="compact-actions">
          <button type="button" class="btn-ornament-glass" id="btnCamMain" onclick="toggleCamera()">📷 Камера AR</button>
          <button type="button" class="btn-ornament-gold" id="btnStartHunt" onclick="openScreen('hunt')">✦ Начать AR-охоту</button>
        </div>

        <p id="txtCamStatus" class="sub-copy" style="font-size: 11.5px; color: var(--turquoise);" aria-live="polite"></p>
        <p class="tiny-legal" id="txtLegal"></p>
      </section>

      <!-- 2. AR-охота поверх камеры -->
      <section class="scene-screen" id="screen-hunt">
        <div class="ar-arena">
          <canvas id="arSparks"></canvas>
          <div class="ar-layer">
            <div class="ar-pill-row">
              <span class="gold-chip" id="txtRadar">🧭 EXPO</span>
              <span class="gold-chip" id="txtScore">0 / 3 • 0 б.</span>
            </div>

            <div class="catch-zone">
              <button type="button" class="ar-chest-btn" id="btnCatch" style="left: 50%; top: 52%;" onclick="catchGift()">
                <span style="font-size: 19px;">🧰</span>
                <span id="txtCatch">ЗАБРАТЬ</span>
              </button>
            </div>

            <div class="compact-caption">
              <strong style="font-size: 12px; color: var(--gold-light);" id="txtCurrentGift"></strong>
              <span style="font-size: 11.5px; color: var(--muted);" id="txtCurrentStep" aria-live="polite"></span>
            </div>
          </div>
        </div>

        <div class="compact-actions">
          <button type="button" class="btn-ornament-glass" id="btnShift" onclick="shiftChest()">✦ Сдвинуть метку</button>
          <button type="button" class="btn-ornament-gold" id="btnToRoute" onclick="openScreen('route')">Маршрут →</button>
        </div>
      </section>

      <!-- 3. Маршрут -->
      <section class="scene-screen" id="screen-route" style="justify-content: flex-start;">
        <h2 class="hero-title" style="font-size: 18px;" id="txtRouteHeading">Маршрут по ТРЦ</h2>
        <div class="route-ribbon" id="routeRibbon"></div>
        <div class="list-stack" id="routeCards"></div>
        <p class="tiny-legal" id="txtRouteNote"></p>
      </section>

      <!-- 4. Подарки -->
      <section class="scene-screen" id="screen-gifts" style="justify-content: flex-start;">
        <div class="ornate-card row-flex">
          <span style="font-size: 13px; color: var(--muted);" id="txtPtsLabel">Демо-баллы:</span>
          <strong style="font-size: 18px; color: var(--gold-light);" id="txtPtsVal">0</strong>
        </div>
        <div class="list-stack" id="giftCards"></div>
        <p class="tiny-legal" id="txtGiftsNote"></p>
      </section>
    </main>

    <nav class="dock" aria-label="Навигация">
      <button type="button" id="nav-qr" class="active" onclick="openScreen('qr')">QR / 30с</button>
      <button type="button" id="nav-hunt" onclick="openScreen('hunt')">AR-Охота</button>
      <button type="button" id="nav-route" onclick="openScreen('route')">Маршрут</button>
      <button type="button" id="nav-gifts" onclick="openScreen('gifts')">Подарки</button>
    </nav>
  </div>

        camOn: 'Камера қосулы — алтын сандық бейне үстінде.',
        camErr: 'Камера қолжетімсіз — камерасыз режим жұмыс істейді.',
        txtLegal: 'Тәуелсіз демо-концепт (MEGA Silk Way ресми өнімі емес). Схема, сыйлықтар мен ұпайлар шартты және келісуді қажет етеді.',
        txtCatch: 'АЛУ',
        btnShift: '✦ Белгіні жылжыту',
        btnToRoute: 'Маршрут →',
        doneAll: 'Барлық 3 сыйлық алынды! «Маршрут» немесе «Сыйлықтар» бөлімін ашыңыз.',
        txtRouteHeading: 'СОО бойынша маршрут',
        txtRouteNote: 'Сценарийді тексеруге арналған шартты демо-схема (MEGA Silk Way ресми жоспары емес).',
        goHunt: 'AR-да табу',
        caughtState: '✓ Алынды',
        txtPtsLabel: 'Демо-ұпайлар:',
        giftsLocked: 'Әлі алынбаған — «AR-Ойын» бөлімін ашыңыз',
        giftsUnlocked: '✓ Демо-сессияда алынды',
        txtGiftsNote: 'Демо-мәртебе: ұпайлар мен сыйлықтар тесттік және келісуді қажет етеді.',
        navQr: 'QR / 30с', navHunt: 'AR-Ойын', navRoute: 'Маршрут', navGifts: 'Сыйлықтар',
        beats: [
          '0–8 с • Кіреберісте алтын арка мен керуен',
          '8–15 с • Батыр сандықты ұсынады',
          '15–22 с • Алтын жарық және жібек ленталар',
          '22–30 с • Сыйлықтар маршрутының басталуы'
        ]
      }
    };

    function chime(freq = 659.25) {
      if (!state.soundOn) return;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      if (!state.audioCtx) state.audioCtx = new AudioCtx();
      if (state.audioCtx.state === 'suspended') state.audioCtx.resume();
      const now = state.audioCtx.currentTime;
      const osc = state.audioCtx.createOscillator();
      const gain = state.audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.045, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
      osc.connect(gain);
      gain.connect(state.audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.26);
    }

    function toggleSound() {
      state.soundOn = !state.soundOn;
      if (state.soundOn) chime(523.25);
      render();
    }

    function toggleLang() {
      state.lang = state.lang === 'ru' ? 'kz' : 'ru';
      render();
    }

    const sparks = Array.from({ length: 30 }, (_, i) => ({
      x: (i * 53) % 390,
      y: (i * 37) % 340,
      r: 1.3 + (i % 2.5),
      vy: 0.4 + (i % 3) * 0.25
    }));

    function drawSparks() {
      const c = document.getElementById('arSparks');
      if (!c) return;
      const rect = c.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      if (c.width !== Math.round(rect.width) || c.height !== Math.round(rect.height)) {
        c.width = Math.round(rect.width);
        c.height = Math.round(rect.height);
      }
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, c.width, c.height);
      ctx.fillStyle = 'rgba(253, 230, 138, 0.8)';
      sparks.forEach(p => {
        p.y -= p.vy;
        if (p.y < -4) p.y = c.height + 4;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      });
      state.animId = requestAnimationFrame(drawSparks);
    }

    function checkVideo() {
      const vid = document.getElementById('introVideo');
      const center = document.getElementById('medallionCenter');
      if (!vid) return;
      vid.src = 'intro.mp4';
      vid.onloadeddata = () => {
        vid.classList.add('has-video');
        center.style.opacity = '0';
        vid.play().catch(() => {});
      };
      vid.onerror = () => {
        vid.classList.remove('has-video');
        center.style.opacity = '1';
      };
    }

    async function toggleCamera() {
      const video = document.getElementById('arCamera');
      const shell = document.getElementById('deviceShell');
      if (state.camOn) {
        if (state.stream) {
          state.stream.getTracks().forEach(t => t.stop());
          state.stream = null;
        }
        video.classList.remove('active');
        shell.classList.remove('cam-live');
        state.camOn = false;
        state.camKey = 'camOff';
        render();
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        state.camKey = 'camErr';
        render();
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        state.stream = stream;
        video.srcObject = stream;
        video.classList.add('active');
        shell.classList.add('cam-live');
        state.camOn = true;
        state.camKey = 'camOn';
      } catch (e) {
        state.camOn = false;
        state.camKey = 'camErr';
      }
      render();
    }

    function shiftChest() {
      state.spotIdx = (state.spotIdx + 1) % spots.length;
      const btn = document.getElementById('btnCatch');
      if (btn) {
        btn.style.left = spots[state.spotIdx].left;
        btn.style.top = spots[state.spotIdx].top;
      }
      chime(440);
    }

    function openScreen(name) {
      state.screen = name;
      document.querySelectorAll('.scene-screen').forEach(el => el.classList.remove('active'));
      document.getElementById('screen-' + name).classList.add('active');
      document.querySelectorAll('.dock button').forEach(b => b.classList.remove('active'));
      document.getElementById('nav-' + name).classList.add('active');

      if (name === 'hunt') {
        if (!state.animId) drawSparks();
        if (!state.moveId) {
          state.moveId = setInterval(() => {
            if (nextItem()) shiftChest();
          }, 2800);
        }
      } else {
        if (state.animId) { cancelAnimationFrame(state.animId); state.animId = null; }
        if (state.moveId) { clearInterval(state.moveId); state.moveId = null; }
      }

      if (name === 'qr') runTimer();
      else stopTimer();

      render();
    }

    function runTimer() {
      stopTimer();
      state.timerId = setInterval(() => {
        state.sec = (state.sec + 1) % 31;
        render();
      }, 1000);
    }

    function stopTimer() {
      if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
    }

    function nextItem() {
      return state.items.find(it => !it.found) || null;
    }

    function catchGift() {
      const it = nextItem();
      if (!it) return;
      it.found = true;
      state.points += it.pts;
      chime(783.99);
      shiftChest();
      render();
    }

    function render() {
      const d = dict[state.lang];
      document.documentElement.lang = state.lang;
      document.getElementById('btnLang').textContent = d.btnLang;
      document.getElementById('btnSound').textContent = state.soundOn ? '🔊' : '🔇';
      document.getElementById('btnCamTop').textContent = state.camOn ? d.camTopOn : d.camTopOff;
      document.getElementById('btnCamMain').textContent = state.camOn ? d.btnCamOff : d.btnCamMain;
      document.getElementById('txtCamStatus').textContent = d[state.camKey];
      document.getElementById('txtBadgeTime').textContent = `${state.sec} / 30 с`;

      const beatIdx = state.sec < 8 ? 0 : (state.sec < 15 ? 1 : (state.sec < 22 ? 2 : 3));
      document.getElementById('txtSceneBeat').textContent = d.beats[beatIdx];

      ['txtKicker','txtBadgeQr','txtTitle','txtVideoHint','txtIntroCopy','btnStartHunt','txtLegal','txtCatch','btnShift','btnToRoute','txtRouteHeading','txtRouteNote','txtPtsLabel','txtGiftsNote'].forEach(id => {
        document.getElementById(id).textContent = d[id];
      });

      ['nav-qr','nav-hunt','nav-route','nav-gifts'].forEach(id => {
        const key = { 'nav-qr':'navQr', 'nav-hunt':'navHunt', 'nav-route':'navRoute', 'nav-gifts':'navGifts' }[id];
        document.getElementById(id).textContent = d[key];
      });

      const foundCnt = state.items.filter(i => i.found).length;
      document.getElementById('txtScore').textContent = `${foundCnt} / ${state.items.length} • ${state.points} б.`;

      const cur = nextItem();
      const catchBtn = document.getElementById('btnCatch');
      if (cur) {
        catchBtn.style.display = 'flex';
        document.getElementById('txtRadar').textContent = `🧭 ${state.lang === 'ru' ? cur.ruZone : cur.kzZone}`;
        document.getElementById('txtCurrentGift').textContent = state.lang === 'ru' ? cur.ruGift : cur.kzGift;
        document.getElementById('txtCurrentStep').textContent = state.lang === 'ru' ? cur.ruStep : cur.kzStep;
      } else {
        catchBtn.style.display = 'none';
        document.getElementById('txtRadar').textContent = '✦ 3 / 3';
        document.getElementById('txtCurrentGift').textContent = d.doneAll;
        document.getElementById('txtCurrentStep').textContent = '';
      }

      const ribbon = document.getElementById('routeRibbon');
      ribbon.innerHTML = '';
      state.items.forEach((it, idx) => {
        const el = document.createElement('div');
        el.className = 'route-stop-pill' + (it.found ? ' done' : '');
        el.textContent = `${idx + 1}. ${state.lang === 'ru' ? it.ruZone : it.kzZone}`;
        ribbon.appendChild(el);
      });

      const routeCards = document.getElementById('routeCards');
      routeCards.innerHTML = '';
      state.items.forEach(it => {
        const row = document.createElement('div');
        row.className = 'ornate-row' + (it.found ? ' done' : '');
        row.innerHTML = `
          <div class="row-flex">
            <strong style="font-size:12.5px;">${state.lang === 'ru' ? it.ruStep : it.kzStep}</strong>
            <span style="font-size:12px;color:var(--gold-light);font-weight:800;">+${it.pts}</span>
          </div>
          <span style="font-size:11.5px;color:var(--turquoise);">${state.lang === 'ru' ? it.ruGift : it.kzGift}</span>
        `;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.disabled = it.found;
        btn.textContent = it.found ? d.caughtState : d.goHunt;
        btn.onclick = () => openScreen('hunt');
        row.appendChild(btn);
        routeCards.appendChild(row);
      });

      document.getElementById('txtPtsVal').textContent = state.points;
      const giftCards = document.getElementById('giftCards');
      giftCards.innerHTML = '';
      state.items.forEach(it => {
        const card = document.createElement('div');
        card.className = 'ornate-row' + (it.found ? ' done' : '');
        card.innerHTML = `
          <div class="row-flex">
            <strong style="font-size:12.5px;">${state.lang === 'ru' ? it.ruGift : it.kzGift}</strong>
            <span style="font-size:12px;color:var(--gold-light);font-weight:800;">+${it.pts}</span>
          </div>
          <span style="font-size:11.5px;color:${it.found ? 'var(--ok)' : 'var(--muted)'};">${it.found ? d.giftsUnlocked : d.giftsLocked}</span>
        `;
        giftCards.appendChild(card);
      });
    }

    checkVideo();
    runTimer();
    render();
  </script>
</body>
</html>
